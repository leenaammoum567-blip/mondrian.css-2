<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #ddd;
        }

        .container {
            width: 470px;
            height: 665px;

            display: grid;

            grid-template-columns: 76px 140px 143px 108px;
            grid-template-rows: 26px 68px 91px 132px 127px 83px 95px;

            gap: 6px;
            background-color: black;
        }

        .b1 {
            background-color: black;
            grid-column: 1;
            grid-row: 1 / 3;
        }

        .w1 {
            background-color: white;
            grid-column: 2;
            grid-row: 1;
        }

        .y1 {
            background-color: yellow;
            grid-column: 3;
            grid-row: 1 / 3;
        }

        .w2 {
            background-color: white;
            grid-column: 4;
            grid-row: 1 / 3;
        }

        .w3 {
            background-color: white;
            grid-column: 1;
            grid-row: 3;
        }

        .w4 {
            background-color: white;
            grid-column: 2;
            grid-row: 2 / 4;
        }

        .r1 {
            background-color: red;
            grid-column: 3;
            grid-row: 3 / 5;
        }

        .w5 {
            background-color: white;
            grid-column: 4;
            grid-row: 3;
        }

        .w6 {
            background-color: white;
            grid-column: 1 / 3;
            grid-row: 4 / 6;
        }

        .r2 {
            background-color: red;
            grid-column: 4;
            grid-row: 4 / 6;
        }

        .w9 {
            background-color: white;
            grid-column: 1;
            grid-row: 6;
        }

        .b2 {
            background-color: blue;
            grid-column: 1;
            grid-row: 7;
        }

        .w7 {
            background-color: white;
            grid-column: 2;
            grid-row: 6 / 8;
        }

        .y2 {
            background-color: yellow;
            grid-column: 3;
            grid-row: 5 / 8;
        }

        .w8 {
            background-color: white;
            grid-column: 4;
            grid-row: 6 / 8;
        }

    </style>
</head>

<body>

    <div class="container">
        <div class="b1"></div>
        <div class="w1"></div>
        <div class="y1"></div>
        <div class="w2"></div>

        <div class="w3"></div>
        <div class="w4"></div>
        <div class="r1"></div>
        <div class="w5"></div>

        <div class="w6"></div>
        <div class="r2"></div>

        <div class="w9"></div>
        <div class="b2"></div>
        <div class="w7"></div>
        <div class="y2"></div>
        <div class="w8"></div>
    </div>

</body>
</html>
